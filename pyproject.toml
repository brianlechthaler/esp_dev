[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-dev"
version = "1.0.0"
description = "Set up an ESP32 development environment with ESP-IDF, PlatformIO, and esptool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brian Lechthaler" }]
keywords = ["esp32", "esp-idf", "platformio", "esptool"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
esp32-dev = "esp32_dev.cli:console_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esp32_dev = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=esp32_dev --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["esp32_dev"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-include = ["install.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["esp32_dev"]
warn_unused_ignores = true
