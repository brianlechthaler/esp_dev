name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          target: test
          tags: esp32-dev:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: docker run --rm esp32-dev:test test

  automerge:
    needs: [test]
    if: >-
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'automerge')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
            exit 0
          fi
          pr="$(gh pr list --head "${{ github.ref_name }}" --label automerge --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr}" ]]; then
            echo "No open automerge pull request for branch ${{ github.ref_name }}."
            exit 0
          fi
          gh pr merge "${pr}" --squash --delete-branch
